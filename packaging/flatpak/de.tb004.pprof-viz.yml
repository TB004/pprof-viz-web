# Flatpak manifest for Pprof-Viz.
#
# Build locally (preferred — handles the .deb build, arch and staging):
#   just flatpak --install
#   just flatpak --arch aarch64 --bundle
# which wraps ./scripts/build-flatpak.py; pass --install-deps to have it fetch
# a missing runtime.

app-id: de.tb004.pprof-viz
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: pprof-viz

finish-args:
  # Display + GPU
  - --socket=wayland
  - --device=dri
  # Network access for the ConnectRPC endpoint
  - --share=network

modules:
  - name: pprof-viz
    buildsystem: simple
    build-commands:
      - ar x pprof-viz.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/Pprof-Viz /app/bin/pprof-viz
      - for size in 32x32 128x128 256x256 512x512; do
          src="usr/share/icons/hicolor/$size/apps/Pprof-Viz.png";
          if [ -f "$src" ]; then
            install -Dm644 "$src" "/app/share/icons/hicolor/$size/apps/de.tb004.pprof-viz.png";
          fi;
        done
      - install -Dm644 de.tb004.pprof-viz.desktop
        /app/share/applications/de.tb004.pprof-viz.desktop
      - install -Dm644 de.tb004.pprof-viz.metainfo.xml
        /app/share/metainfo/de.tb004.pprof-viz.metainfo.xml
    sources:
      - type: file
        path: pprof-viz.deb
      - type: file
        path: de.tb004.pprof-viz.desktop
      - type: file
        path: de.tb004.pprof-viz.metainfo.xml
