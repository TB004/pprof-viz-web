// On-disk container of a `.ppvz` file. These messages used to live in
// collector.proto; they are not part of the collector wire contract.

syntax = "proto3";

package proto;

import "collector.proto";

// Metadata of an on-disk stored .ppvz file that is directy
// embedded into the file to be self-contained and portable
message CollectionMeta {
  string name = 1;
  string description = 2;
  string profile_name = 3;
  string profile_url = 4;
  string mode = 5;
  int64 created_at = 6;
  int64 duration_ms = 7;
  uint32 sample_count = 8;
}

message StoredCollection {
  uint32 format_version = 1;
  // Contains the buckets that are shared across each sample
  MetadataResponse metadata = 2;
  repeated AllResponse frames = 3;
  // Wall-clock arrival time (epoch millis) of each frame, parallel to `frames`.
  repeated int64 frame_timestamps = 4;
  CollectionMeta meta = 5;
}
