# `bundle-native` builds platform installers on native runners:
#   - macOS arm64  → .dmg  (uploaded to release directly)
#   - Windows x86_64 / arm64  → .msi  (uploaded to release directly)
#   - Linux x86_64 / arm64 → .deb (artifact only, intermediate for flatpak)

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  Release_Linux:
    name: Build app as Linux flatpaks
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        include:
          - target: x86_64
            deb_arch: amd64
            runs-on: ubuntu-latest
          - target: aarch64
            deb_arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            elfutils \
            flatpak \
            flatpak-builder \
            gcc \
            jq \
            libappindicator3-dev \
            libprotobuf-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            protobuf-compiler \
            unzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.96.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Cache Bun packages
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-

      - name: Install cargo-binstall
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: command -v cargo-tauri || cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Flatpak repo
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak builder
        uses: actions/cache@v6
        with:
          path: packaging/flatpak/.flatpak-builder
          key: ${{ runner.os }}-${{ matrix.target }}-flatpak-builder-${{ hashFiles('packaging/flatpak/de.tb004.pprof_viz.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-flatpak-builder-

      - name: Build .deb package
        run: cargo tauri build --ci --bundles deb

      - name: Stage .deb for flatpak-builder
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          cp "./src-tauri/target/release/bundle/deb/Pprof-Viz_${VERSION}_${{ matrix.deb_arch }}.deb" \
             ./packaging/flatpak/pprof-viz.deb

      - name: Build flatpak bundle
        working-directory: packaging/flatpak
        run: |
          flatpak-builder \
            --arch=${{ matrix.target }} \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            build-dir \
            de.tb004.pprof_viz.yml

          flatpak build-bundle \
            --arch=${{ matrix.target }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            Pprof-Viz_${{ matrix.target }}.flatpak \
            de.tb004.pprof_viz

      - name: Upload flatpak to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            packaging/flatpak/Pprof-Viz_${{ matrix.target }}.flatpak \
            --clobber

  Release_macOS:
    name: Build app for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install protobuf

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.96.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-cargo-

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Cache Bun packages
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-aarch64-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-bun-

      - name: Install cargo-binstall
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: command -v cargo-tauri || cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build .dmg
        run: cargo tauri build --ci --bundles dmg --target aarch64-apple-darwin

      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Pprof-Viz_${VERSION}_aarch64.dmg" \
            --clobber

  Release_Windows:
    name: Build app for Windows
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runs-on: windows-latest
            msi_arch: x64
            rust_target: x86_64-pc-windows-msvc
          - target: aarch64
            runs-on: windows-11-arm
            msi_arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install protobuf
        run: choco install protoc -y

      - name: Install Rust
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://static.rust-lang.org/rustup/dist/${{ matrix.rust_target }}/rustup-init.exe" `
            -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain 1.96.0 --no-modify-path
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Bun
        run: |
          powershell -c "irm bun.sh/install.ps1 | iex"
          echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Bun packages
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-

      - name: Install cargo-binstall
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: command -v cargo-tauri || cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build .msi
        run: cargo tauri build --ci --bundles msi --target ${{ matrix.rust_target }}

      - name: Upload .msi to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/Pprof-Viz_${VERSION}_${{ matrix.msi_arch }}_en-US.msi" \
            --clobber
