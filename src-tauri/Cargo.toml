[package]
name = "Pprof-Viz"
version = "0.1.0"
description = "Live visualizer for Go runtime metrics streamed via ConnectRPC"
authors = ["Tizian Bahr"]
license = "MIT"
repository = "https://github.com/TB004/pprof-viz"
edition = "2024"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
connectrpc-build = "0.6.0"

[dependencies]
connectrpc = { version = "0.6.1", features = [
    "default",
    "client",
    "client-tls",
] }
rustls = "0.23.40"
webpki-roots = "1.0.7"
buffa = { version = "0.6.0", features = ["json"] }
buffa-types = { version = "0.6.0", features = ["json"] }
http = "1.4.1"
http-body = "1.0.1"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
ulid = { version = "1.2.1", features = ["serde"] }
url = "2.5.8"
tokio = { version = "1.52.3", features = ["sync", "rt", "macros", "time"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-store = "2.4.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "derive",
] }
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[profile.release]
codegen-units = 1
strip = "debuginfo"
lto = "fat"
