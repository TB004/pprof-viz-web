# `bundle-native` builds platform installers on native runners:
#   - macOS arm64  → .dmg  (uploaded to release directly)
#   - Windows x64  → .msi  (uploaded to release directly)
#   - Windows arm64 → .msi (uploaded to release directly)
#   - Linux x86_64 / aarch64 → .deb (artifact only, intermediate for flatpak)

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.1.0)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  Release_Linux:
    name: Build app to Linux flatpaks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            deb_arch: amd64
          - target: aarch64
            deb_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU for cross-platform builds
        if: matrix.target != 'x86_64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.target }}

      - name: Update APT-Repos
        run: sudo apt update

      - name: Install system dependencies
        run: sudo apt install -y flatpak flatpak-builder jq

      - name: Install docker tools
        run: curl --proto '=https' --tlsv1.2 -sSf https://get.docker.com/ | sh

      - name: Setup flatpak repo
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build builder image
        run: |
          docker build \
            --platform linux/${{ matrix.target }} \
            -t tauri-builder \
            -f .github/workflows/Dockerfile \
            .

      - name: Build .deb package
        run: |
          docker run --rm \
            --platform linux/${{ matrix.target }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            tauri-builder \
            bash -c "bun install --frozen-lockfile && cargo tauri build --ci --bundles deb"

      - name: Stage .deb for flatpak-builder
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          cp "./src-tauri/target/release/bundle/deb/Pprof-Viz_${VERSION}_${{ matrix.deb_arch }}.deb" \
             ./packaging/flatpak/pprof-viz.deb

      - name: Build flatpak bundle
        working-directory: packaging/flatpak
        run: |
          flatpak-builder \
            --arch=${{ matrix.target }} \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            build-dir \
            de.tb004.pprof_viz.yml

          flatpak build-bundle \
            --arch=${{ matrix.target }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            pprof-viz_${{ matrix.target }}.flatpak \
            de.tb004.pprof_viz

      - name: Upload flatpak to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            packaging/flatpak/pprof-viz_${{ matrix.target }}.flatpak \
            --clobber
