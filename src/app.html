<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		>
		<title>Pprof-Viz</title>
		<meta
			name="description"
			content="Live visualizer for Go runtime metrics streamed via ConnectRPC."
		>
		<meta name="color-scheme" content="light dark">
		<meta
			name="theme-color"
			content="#ffffff"
			media="(prefers-color-scheme: light)"
		>
		<meta
			name="theme-color"
			content="#0f172a"
			media="(prefers-color-scheme: dark)"
		>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32">
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/logo.svg"
			type="image/svg+xml"
		>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-256.png">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Pprof-Viz">
		<script>
		// Runs before first paint so an installed app never flashes the wrong
		// theme. Mirrors the key the settings service writes.
		var s, theme, dark;
		try {
			s = JSON.parse(localStorage.getItem("pprof-viz-settings") || "{}");
		} catch (_) {}
		theme = s?.theme || "system";
		dark =
			theme === "dark" ||
			(theme === "system" &&
				window.matchMedia("(prefers-color-scheme: dark)").matches);
		if (dark) document.documentElement.classList.add("dark");
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
