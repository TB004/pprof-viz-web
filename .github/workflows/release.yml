# `bundle-native` builds platform installers on native runners:
#   - macOS arm64  → .dmg  (uploaded to release directly)
#   - Windows x86_64 / arm64  → .msi  (uploaded to release directly)
#   - Linux x86_64 / arm64 → .deb (artifact only, intermediate for flatpak)
#
# Deliberately uncached. This workflow triggers on `release: published`, so
# every job runs on a tag ref, and Actions scopes cache reads to the current ref
# plus the default branch. A cache saved here is keyed to that one tag and can
# never be restored by a later release, while the five matrix legs would write
# several GB apiece against the repository's 10 GB LRU quota — evicting the
# main-branch caches that Pull Request Checks depends on.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  Release_Linux:
    name: Build app as Linux flatpaks
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        include:
          - target: x86_64
            runs-on: ubuntu-latest
          - target: aarch64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            elfutils \
            flatpak \
            flatpak-builder \
            gcc \
            jq \
            libappindicator3-dev \
            libprotobuf-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            protobuf-compiler \
            unzip

      # No `--default-toolchain`: rust-toolchain.toml is the single source of
      # truth, and `rustup show` materialises whatever it pins.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        run: cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Setup Flatpak repo
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak bundle
        run: ./scripts/build-flatpak.py --arch ${{ matrix.target }} --bundle --install-deps

      - name: Upload flatpak to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/flatpak/dist/de.tb004.pprof-viz-*-${{ matrix.target }}.flatpak \
            --clobber

  Release_macOS:
    name: Build app for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install protobuf

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        run: cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build .dmg
        run: cargo tauri build --ci --bundles dmg --target aarch64-apple-darwin

      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Pprof-Viz_${VERSION}_aarch64.dmg" \
            --clobber

  Release_Windows:
    name: Build app for Windows
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runs-on: windows-latest
            msi_arch: x64
            rust_target: x86_64-pc-windows-msvc
          - target: aarch64
            runs-on: windows-11-arm
            msi_arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install protobuf
        run: choco install protoc -y

      - name: Install Rust
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://static.rust-lang.org/rustup/dist/${{ matrix.rust_target }}/rustup-init.exe" `
            -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain none --no-modify-path
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install Bun
        run: |
          powershell -c "irm bun.sh/install.ps1 | iex"
          echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-binstall
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | sh

      - name: Install Tauri CLI
        shell: bash
        run: cargo binstall -y --disable-telemetry tauri-cli

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build .msi
        run: cargo tauri build --ci --bundles msi --target ${{ matrix.rust_target }}

      - name: Upload .msi to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/Pprof-Viz_${VERSION}_${{ matrix.msi_arch }}_en-US.msi" \
            --clobber
