name: Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded pushes to a PR are pointless work, and two runs of the same branch
# race to write the same cache keys. Pushes to main are left alone so every
# commit on the default branch keeps producing the caches that PRs restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Cache Bun package store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/bin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the generated protobuf client is up to date
        run: |
          just proto
          git diff --exit-code -- src/lib/proto/gen \
            || { echo "::error::src/lib/proto/gen is stale — run 'just proto' and commit the result"; exit 1; }

      - name: Run vulnerability scan
        run: just vuln

      - name: Run verification checks
        run: just verify

      - name: Build the static site
        run: just build
