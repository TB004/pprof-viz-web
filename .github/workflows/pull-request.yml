name: Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded pushes to a PR are pointless work, and two runs of the same branch
# race to write the same cache keys. Pushes to main are left alone so every
# commit on the default branch keeps producing the caches that PRs restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the generated protobuf client is up to date
        run: |
          just proto
          git diff --exit-code -- src/lib/proto/gen \
            || { echo "::error::src/lib/proto/gen is stale — run 'just proto' and commit the result"; exit 1; }

      - name: Run vulnerability scan
        run: just vuln

      - name: Run verification checks
        run: just verify

      - name: Build the static site
        run: just build
