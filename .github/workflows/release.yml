# Publishes two artifacts for every published release:
#   - `pprof-viz-web-<tag>.tar.gz` — the static site, for hosting it yourself
#   - `ghcr.io/<owner>/pprof-viz-web` — Caddy plus that same site

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  site:
    name: Build and attach the static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the static site
        run: bun run build

      - name: Upload the static site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 1
          if-no-files-found: error

      - name: Attach the static site to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="pprof-viz-web-${{ github.ref_name }}.tar.gz"
          tar -czf "$tarball" -C build .
          gh release upload "${{ github.ref_name }}" "$tarball" --clobber

  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    needs: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the static site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pprof-viz-web
          # `latest` only for a final release — a prerelease tag must not become
          # what an unqualified `podman pull` resolves to.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Containerfile.dist
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
