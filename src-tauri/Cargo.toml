[package]
name = "Pprof-Viz"
version = "0.1.0"
description = "Live visualizer for Go runtime metrics streamed via ConnectRPC"
authors = ["Tizian Bahr"]
license = "GPL-3.0-or-later"
repository = "https://github.com/TB004/pprof-viz"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
connectrpc-build = "0.8.0"

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "derive",
    "macros",
    "migrate",
] }
reqwest = { version = "0.13.4", features = ["json"] }
fs4 = "1.1.0"
zstd = "0.13.3"
connectrpc = { version = "0.8.1", features = [
    "default",
    "client",
    "client-tls",
] }
rustls = "0.23.43"
rustls-platform-verifier = "0.7.0"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.11", features = ["rustls-aws-lc-rs"] }
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.4"
futures-util = { version = "0.3.33", default-features = false, features = [
    "std",
    "async-await",
] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.20"
ulid = { version = "3.0.0", features = ["serde"] }
url = "2.5.8"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "time"] }
tauri = { version = "2.11.5", features = [] }
semver = "1.0.28"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[profile.release]
codegen-units = 1
strip = true
lto = "fat"
opt-level = 3
