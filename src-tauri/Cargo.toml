[package]
name = "Pprof-Viz"
version = "0.1.0"
description = "Live visualizer for Go runtime metrics streamed via ConnectRPC"
authors = ["Tizian Bahr"]
license = "MIT"
repository = "https://github.com/TB004/pprof-viz"
edition = "2024"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
connectrpc-build = "0.4"

[dependencies]
connectrpc = { version = "0.4", features = ["default", "client", "client-tls"] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
webpki-roots = "1"
buffa = { version = "0.5", features = ["json"] }
buffa-types = { version = "0.5", features = ["json"] }
http = "1"
http-body = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
ulid = { version = "1", features = ["serde"] }
url = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "derive",
] }
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[profile.release]
strip = "debuginfo"
lto = "fat"
codegen-units = 1
