name: Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Vulnerability, verification, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update APT-Repos
        run: apt update && apt upgrade -y

      - name: Install system dependencies
        run: apt install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          g++ \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

      - name: Set up Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Install Just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/bin

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Restore Bun and dependency cache
        id: bun-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Restore Rust and dependency cache
        id: rust-cache
        uses: actions/cache@v5
        with:
          path: |
            ./src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('./src-tauri/Cargo.lock', './src-tauri/Cargo.toml') }}

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install

      - name: Run vulnerability scan
        run: just vuln

      - name: Run verification checks
        run: just verify
